<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedEssay — MCQ Practice</title>
  <link rel="stylesheet" href="ai.css">
  <script src="theme.js"></script>
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZHRQKJS5EN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-ZHRQKJS5EN');
</script>
<body>
  <div class="container">
    <div class="selection-screen flex-column">

      <a href="index.html" class="back-btn">← Back</a>

      <!-- STEP 1: Subject -->
      <div class="step" id="step-subject">
        <h2>Choose a Subject</h2>
        <div class="card-grid">
          <div class="subject-card" data-subject="anatomy">
            <span class="card-icon">🦴</span>
            <h3>Anatomy</h3>
            <p>Regional, Neuro, Histo &amp; Embryo</p>
          </div>
          <div class="subject-card" data-subject="physiology">
            <span class="card-icon">⚡</span>
            <h3>Physiology</h3>
            <p>CVS, Respiratory, Renal, GIT &amp; more</p>
          </div>
          <div class="subject-card" data-subject="biochemistry">
            <span class="card-icon">🧪</span>
            <h3>Biochemistry</h3>
            <p>Metabolism, Molecular, Cellular &amp; more</p>
          </div>
        </div>
      </div>

      <!-- STEP 2: Topic -->
      <div class="step hidden" id="step-topic">
        <h2>Choose a Topic</h2>
        <div class="topic-list" id="topic-list"></div>
      </div>

      <!-- STEP 3: Number of questions -->
      <div class="step hidden" id="step-size">
        <h2>How Many Questions?</h2>
        <p class="step-hint">Single-best-answer MCQs, 1 mark each.</p>
        <div class="marks-selector">
          <button class="mark-btn" data-size="20">20</button>
          <button class="mark-btn" data-size="40">40</button>
          <button class="mark-btn" data-size="60">60</button>
          <button class="mark-btn" data-size="80">80</button>
          <button class="mark-btn" data-size="100">100</button>
        </div>
        <button class="btn btn-primary hidden" id="proceed-btn">Start MCQs →</button>
      </div>

    </div>
  </div>
  <script src="sub.js"></script>
</body>
</html>
